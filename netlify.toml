[build]
  publish = "."
  command = ""

# Cartridge and disc images have no registered media type, so a fair number of
# hosts refuse to serve them. Declaring them as opaque binaries fixes that.
[[headers]]
  for = "/games/*"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "SAMEORIGIN"
